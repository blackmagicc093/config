[URL Rewrite]
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ REJECT-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking|api\/stats\/ads) _ REJECT-200
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ REJECT-200
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+&ctier=L(&.+) $1&ctier=A$2 HEADER
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad _ REJECT-IMG
^https?:\/\/.+\.googlevideo\.com\/.*&(oad|ctier) _ REJECT
^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v\d\/player\/ad_break url REJECT
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad _ REJECT-IMG
https?:\/\/.+\.googlevideo\.com\/.+&oad reject header
https?:\/\/.+\.googlevideo\.com\/ptracking\?pltype=adhost reject header
https?:\/\/.+\.youtube\.com\/api\/stats\/.+adformat reject header
https?:\/\/.+\.youtube\.com\/api\/stats\/ads reject header
https?:\/\/.+\.youtube\.com\/get_midroll reject header
https?:\/\/.+\.youtube\.com\/pagead\/ reject header
https?:\/\/.+\.youtube\.com\/ptracking\? reject header
https?:\/\/m\.youtube\.com\/_get_ads reject header
https?:\/\/pagead2\.googlesyndication\.com\/pagead\/ reject header
https?:\/\/s\.youtube\.com\/api\/stats\/watchtime?adformat reject header

[Header Rewrite]
^https?:\/\/api.revenuecat.com\/.+\/(receipts$|subscribers\/?) header-del X-RevenueCat-ETag
^https:\/\/spclient\.wg\.spotify\.com\/user-customization-service\/v1\/customize$ header-del if-none-match

[Script]
youtube.request = type=http-request,script-path=https://raw.githubusercontent.com/blackmagicc093/loon_conf/refs/heads/main/youtube.request.js,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|reel\/reel_watch_sequence)\?,max-size=1024,requires-body=true,binary-mode=true,timeout=10,script-update-interval=60,enable=true
youtube.response = type=http-response,script-path=https://raw.githubusercontent.com/blackmagicc093/loon_conf/refs/heads/main/youtube.response.js,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting)\?,max-size=1024,requires-body=true,binary-mode=true,timeout=10,script-update-interval=60,argument={"lyricLang":"vi","captionLang":"vi","blockUpload":true,"blockImmersive":true,"debug":false},enable=true

Spotify Premium
#By: Nobita (MOD CSA) fix by BLACKMAGICC
spotify-json = type=http-request,pattern=^https:\/\/spclient\.wg\.spotify\.com\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/,requires-body=0,script-path=https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-json.js
spotify-proto = type=http-response,pattern=^https:\/\/spclient\.wg\.spotify\.com\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$,requires-body=1,binary-body-mode=1,max-size=1024,script-path=https://raw.githubusercontent.com/app2smile/rules/master/js/spotify-proto.js,script-update-interval=60

