[General]
tun-included-routes = 
hijack-dns = 
bypass-system = true
skip-proxy = 
tun-excluded-routes = 
dns-server = 
fallback-dns-server = 
ipv6 = false
prefer-ipv6 = false
dns-direct-system = false
icmp-auto-reply = true
always-reject-url-rewrite = false
private-ip-answer = true
# direct domain fail to resolve use proxy rule
dns-direct-fallback-proxy = true
# The fallback behavior when UDP traffic matches a policy that doesn't support the UDP relay. Possible values: DIRECT, REJECT.
udp-policy-not-supported-behaviour = REJECT
update-url = https://raw.githubusercontent.com/blackmagicc093/config/refs/heads/main/BLACKSEED.conf

[Rule]
URL-REGEX,https?:\/\/(s\.youtube\.com\/api\/stats\/qoe\?adformat|youtubei.googleapis.com\/youtubei\/.+(ad|log)|youtubei.googleapis.com\/.+ad_break|.+\.youtube\.com\/_(get_ads|ptracking\?|pagead\/|get_midroll_|api\/stats\/ads)) ,REJECT
URL-REGEX,https?:\/\/.+\.googlevideo\.com\/(ptracking\?pltype=adhost|.+&oad) ,REJECT-IMG
AND,((DOMAIN-SUFFIX,googlevideo.com),(DEST-PORT,443),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(DEST-PORT,443),(PROTOCOL,UDP)),REJECT
GEOIP,VN,PROXY
# AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
